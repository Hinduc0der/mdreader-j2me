# ProGuard для J2ME: сжимаем, обфусцируем и предварительно верифицируем классы.
# -microedition заменяет preverify из WTK: ProGuard пишет StackMap в формате CLDC.

-microedition
-target 1.3
-dontusemixedcaseclassnames
-overloadaggressively
-repackageclasses ''
-allowaccessmodification
-dontnote
-dontwarn

# Точку входа трогать нельзя — её ищет система по имени из манифеста.
-keep public class mdreader.MDReaderMIDlet {
    public *;
    protected *;
}
-keep public class * extends javax.microedition.midlet.MIDlet

# Обработчики lcdui вызываются системой по сигнатуре.
-keepclassmembers class * extends javax.microedition.lcdui.Canvas {
    protected void paint(javax.microedition.lcdui.Graphics);
    protected void keyPressed(int);
    protected void keyReleased(int);
    protected void keyRepeated(int);
    protected void pointerPressed(int, int);
    protected void pointerReleased(int, int);
    protected void pointerDragged(int, int);
}
